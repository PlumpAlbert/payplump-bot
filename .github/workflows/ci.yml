name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_neon:
        description: Also run the latency-sensitive configuration workflow on Neon
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-postgres-settings:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 2
    env:
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PGUSER: ${{ vars.PGUSER }}
      PGSSLMODE: ${{ vars.PGSSLMODE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - name: Validate PostgreSQL settings
        shell: bash
        run: |
          missing=0
          for name in PGHOST PGPORT PGDATABASE PGUSER PGSSLMODE PGPASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configure $name in Environment test variables (PGPASSWORD in Environment test secrets)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi
          if [[ "$PGHOST" == *-pooler.*.neon.tech ]]; then
            echo "::error::Use the Neon direct endpoint (without -pooler); integration tests require session-level search_path isolation"
            exit 1
          fi
  test:
    needs: validate-postgres-settings
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 75
    services:
      configuration-postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: workflow_test
          POSTGRES_DB: workflow_test
          POSTGRES_PASSWORD: synthetic-local-password
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - "127.0.0.1:15433:5432"
        options: >-
          --health-cmd "pg_isready -U workflow_test -d workflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PGUSER: ${{ vars.PGUSER }}
      PGSSLMODE: ${{ vars.PGSSLMODE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      # Keep runner-provided URLs from overriding the CI PG* settings.
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
      TELEGRAM_ENABLED: "false"
      REGISTRATION_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      ACTIVATION_ENABLED: "false"
      CONFIGURATION_DELIVERY_ENABLED: "false"
      SMOKE_SCHEMA: ci_smoke_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet ./...
      - name: Protected configuration E2E against loopback PostgreSQL
        env:
          # Only this step uses the disposable service, never the Neon settings.
          PGHOST: 127.0.0.1
          PGPORT: "15433"
          PGUSER: workflow_test
          PGDATABASE: workflow_test
          PGPASSWORD: synthetic-local-password
          PGSSLMODE: disable
          PGOPTIONS: ""
          DATABASE_URL: ""
          TEST_DATABASE_URL: postgres://workflow_test:synthetic-local-password@127.0.0.1:15433/workflow_test?sslmode=disable
        run: go test -v -race -tags=integration -count=1 -timeout=5m -run '^TestConfigurationWorkflowWithSyntheticHTTP$' ./internal/postgres
      - name: Neon integration and race suite
        env:
          FULL_NEON: ${{ github.event_name == 'workflow_dispatch' && inputs.full_neon || false }}
        run: |
          if [ "$FULL_NEON" = true ]; then
            echo 'Running the unfiltered suite on Neon; mandatory loopback E2E already ran above.'
            go test -v -race -tags=integration -count=1 -timeout=60m ./...
          else
            echo 'Exactly TestConfigurationWorkflowWithSyntheticHTTP runs in the mandatory loopback step above; all other tests run on Neon.'
            go test -v -race -tags=integration -count=1 -timeout=60m -skip '^TestConfigurationWorkflowWithSyntheticHTTP$' ./...
          fi
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/payplump ./cmd/payplump
      - name: Create isolated smoke schema
        id: smoke-schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -v schema="$SMOKE_SCHEMA" <<'SQL'
          CREATE SCHEMA :"schema";
          SQL
      - name: Smoke test against Neon
        env:
          PGOPTIONS: -c search_path=${{ env.SMOKE_SCHEMA }}
        run: |
          actual=$(psql -X -v ON_ERROR_STOP=1 -Atc 'SELECT current_schema()')
          if [ "$actual" != "$SMOKE_SCHEMA" ]; then
            echo "::error::Smoke schema isolation failed; refusing to run migrations in the shared schema"
            exit 1
          fi
          python3 scripts/smoke.py
      - run: git diff --exit-code -- go.mod go.sum
      - name: Build and start development containers
        env:
          # Compose uses its own local PostgreSQL without TLS, not Neon.
          PGSSLMODE: disable
        run: VCS_REF="$GITHUB_SHA" docker compose -p payplump-ci -f compose.dev.yaml up --build --wait --wait-timeout 120
      - name: Check container and restart
        env:
          PGSSLMODE: disable
        run: |
          docker compose -p payplump-ci -f compose.dev.yaml exec -T app /payplump healthcheck
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          docker compose -p payplump-ci -f compose.dev.yaml stop app
          docker compose -p payplump-ci -f compose.dev.yaml up -d --wait --wait-timeout 60
          docker compose -p payplump-ci -f compose.dev.yaml exec -T app /payplump healthcheck
      - name: Container logs
        if: failure()
        env:
          PGSSLMODE: disable
        run: docker compose -p payplump-ci -f compose.dev.yaml logs
      - name: Clean up test containers
        if: always()
        env:
          PGSSLMODE: disable
        run: docker compose -p payplump-ci -f compose.dev.yaml down --volumes
      - name: Drop isolated smoke schema
        if: ${{ always() && steps.smoke-schema.outcome == 'success' }}
        run: |
          psql -X -v ON_ERROR_STOP=1 -v schema="$SMOKE_SCHEMA" <<'SQL'
          DROP SCHEMA :"schema" CASCADE;
          SQL
