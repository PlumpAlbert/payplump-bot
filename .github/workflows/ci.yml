name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: ${{ vars.PGUSER }}
          POSTGRES_DB: ${{ vars.PGDATABASE }}
          POSTGRES_PASSWORD: ${{ secrets.PGPASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          PGUSER: ${{ vars.PGUSER }}
          PGDATABASE: ${{ vars.PGDATABASE }}
        ports:
          - ${{ vars.PGPORT }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PGUSER: ${{ vars.PGUSER }}
      PGSSLMODE: ${{ vars.PGSSLMODE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      # Keep runner-provided URLs from overriding the CI PG* settings.
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate PostgreSQL settings
        shell: bash
        run: |
          for name in PGHOST PGPORT PGDATABASE PGUSER PGSSLMODE PGPASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in GitHub Actions variables (PGPASSWORD in secrets)"
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -tags=integration -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/payplump ./cmd/payplump
      - run: python3 scripts/smoke.py
      - run: git diff --exit-code -- go.mod go.sum
      - name: Build and start development containers
        run: VCS_REF="$GITHUB_SHA" docker compose -p payplump-ci -f compose.dev.yaml up --build --wait --wait-timeout 120
      - name: Check container and restart
        run: |
          docker compose -p payplump-ci -f compose.dev.yaml exec -T app /payplump healthcheck
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          docker compose -p payplump-ci -f compose.dev.yaml stop app
          docker compose -p payplump-ci -f compose.dev.yaml up -d --wait --wait-timeout 60
          docker compose -p payplump-ci -f compose.dev.yaml exec -T app /payplump healthcheck
      - name: Container logs
        if: failure()
        run: docker compose -p payplump-ci -f compose.dev.yaml logs
      - name: Clean up test containers
        if: always()
        run: docker compose -p payplump-ci -f compose.dev.yaml down --volumes
