# Basic deployment: one bot, external PostgreSQL, private runtime environment.
# Copy .env.example to a private .env, or set PAYPLUMP_ENV_FILE to its path
# on the Docker host. Never commit the filled file.
# Starting the service automatically manages eligible configured-panel clients.
services:
  payplump:
    image: ${PAYPLUMP_IMAGE:-ghcr.io/plumpalbert/payplump-bot:main}
    restart: unless-stopped
    stop_grace_period: 30s
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    env_file:
      - path: ${PAYPLUMP_ENV_FILE:-.env}
        required: true
    environment:
      HTTP_ADDR: ":8080"
    # No public port is required for Telegram polling. A secured reverse proxy
    # is needed only if incoming Telegram or Ninja webhooks are configured.
    ports:
      - "127.0.0.1:${PAYPLUMP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/payplump", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    mem_limit: 512m # Initial limit, adjust after observing the target host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
