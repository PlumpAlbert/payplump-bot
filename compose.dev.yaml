# Isolated local development. Supply database settings outside Git.
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${PAYPLUMP_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: payplump:dev
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?Set PGUSER}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:?Set PGSSLMODE}
      DB_MAX_CONNS: "4"
      HTTP_ADDR: ":8080"
      GOMEMLIMIT: 96MiB
    ports:
      - "127.0.0.1:${PAYPLUMP_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
