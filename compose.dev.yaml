# Isolated local development. Supply database settings outside Git.
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${PAYPLUMP_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: payplump:dev
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?Set PGUSER}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:?Set PGSSLMODE}
      DB_MAX_CONNS: "4"
      HTTP_ADDR: ":8080"
      TZ: ${TZ:-UTC}
      GOMEMLIMIT: 96MiB
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-2}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_WORKERS: ${REGISTRATION_WORKERS:-1}
      REGISTRATION_POLL_INTERVAL: ${REGISTRATION_POLL_INTERVAL:-1s}
      REGISTRATION_HTTP_TIMEOUT: ${REGISTRATION_HTTP_TIMEOUT:-5s}
      REGISTRATION_EXCLUDED_TELEGRAM_IDS: ${REGISTRATION_EXCLUDED_TELEGRAM_IDS:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENTS_WORKERS: ${PAYMENTS_WORKERS:-1}
      PAYMENTS_POLL_INTERVAL: ${PAYMENTS_POLL_INTERVAL:-1s}
      PAYMENTS_RECHECK_INTERVAL: ${PAYMENTS_RECHECK_INTERVAL:-5m}
      PAYMENTS_HTTP_TIMEOUT: ${PAYMENTS_HTTP_TIMEOUT:-5s}
      PAYMENTS_CURRENCY_ID: ${PAYMENTS_CURRENCY_ID:-}
      INVOICE_NINJA_WEBHOOK_SECRET: ${INVOICE_NINJA_WEBHOOK_SECRET:-}
      PAYMENT_PHONE: ${PAYMENT_PHONE:-}
      PAYMENT_BANK: ${PAYMENT_BANK:-}
      PAYMENT_RECIPIENT: ${PAYMENT_RECIPIENT:-}
      # Read-only preflight; Invoice Ninja writes require the separate opt-in.
      INVOICE_NINJA_BASE_URL: ${INVOICE_NINJA_BASE_URL:-}
      INVOICE_NINJA_API_TOKEN: ${INVOICE_NINJA_API_TOKEN:-}
      INVOICE_NINJA_PRODUCT_ID: ${INVOICE_NINJA_PRODUCT_ID:-}
      INVOICE_NINJA_INCLUSIVE_TAXES: ${INVOICE_NINJA_INCLUSIVE_TAXES:-}
      INVOICE_NINJA_TELEGRAM_ID_FIELD: ${INVOICE_NINJA_TELEGRAM_ID_FIELD:-id_number}
      INVOICE_NINJA_VERSION: ${INVOICE_NINJA_VERSION:-}
      SUI_BASE_URL: ${SUI_BASE_URL:-}
      SUI_API_TOKEN: ${SUI_API_TOKEN:-}
      SUI_INBOUND_IDS: ${SUI_INBOUND_IDS:-}
      SUI_SUBSCRIPTION_BASE_URL: ${SUI_SUBSCRIPTION_BASE_URL:-}
      SUI_VERSION: ${SUI_VERSION:-}
      INTEGRATION_HTTP_TIMEOUT: ${INTEGRATION_HTTP_TIMEOUT:-10s}
      INTEGRATION_PAGE_SIZE: ${INTEGRATION_PAGE_SIZE:-50}
      INTEGRATION_MAX_PAGES: ${INTEGRATION_MAX_PAGES:-20}
    ports:
      - "127.0.0.1:${PAYPLUMP_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
